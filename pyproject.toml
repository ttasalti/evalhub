[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalhub"
version = "0.1.0"
description = "All-in-one benchmarking platform for evaluating LLMs"
readme = "README.md"
requires-python = ">=3.8,<3.13"
license = {file = "LICENSE"}
authors = [
    {name = "Shengyu Ye", email = "ysy007@mail.ustc.edu.cn"}
]
maintainers = [
    {name = "Tarık Tuna Taşaltı", email = "tekup99@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core minimal dependencies
dependencies = [
    "typer",
    "litellm",
    "tenacity",
    "requests",
    "pydantic",
    "rich",
    "tqdm",
    "loguru",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
]

# All production dependencies
base = [
    "numpy",
    "pandas",
    "psutil",
    "orjson",
    "openai",
    "datasets",
    "huggingface-hub",
    "hf_transfer",
    "sympy",
    "pylatexenc",
    "evalplus",
    "omegaconf",
    "latex2sympy2",
    "jsonlines",
    "aiofiles",
    "antlr4-python3-runtime==4.7.2",
]

# SGLang specific dependencies
sglang = [
    "sglang>=0.5.5.post1",
    "sglang-router",
]

# Reporting (aggregation + plotting)
report = [
    "pandas",
    "matplotlib",
    "seaborn",
]

# Complete set (all + dev)
all = [
    "evalhub[base,dev,sglang,report]",
]

[project.scripts]
evalhub = "evalhub.cli:main"

# Discover evalhub and every subpackage (benchmarks/, report/, cot/, ...) so a
# non-editable `pip install .` ships the whole tree, not just the top module.
# `include` keeps tests/, examples/, scripts/ and inspect/ out of the wheel.
[tool.setuptools.packages.find]
include = ["evalhub*"]

# Bundle the benchmark data + tool configs that live next to the code, so the
# local datasets work from an installed wheel (not only an editable checkout).
[tool.setuptools.package-data]
"*" = ["*.parquet", "*.csv", "*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Prompt-bearing files are frozen for experiment reproducibility: the exact
# judge/generation prompt text (and the whitespace inside those strings) must
# not be reformatted, so they are excluded from linting/formatting.
extend-exclude = [
    "evalhub/benchmarks/cot/prompts.py",
    "evalhub/benchmarks/cot/judge.py",
    "evalhub/benchmarks/math/__init__.py",
    "evalhub/benchmarks/math/aime2026/__init__.py",
    "evalhub/benchmarks/math/aime2026_tr/__init__.py",
    "evalhub/benchmarks/math/aime2026_pt/__init__.py",
    "evalhub/benchmarks/math/tubitak_math2026/__init__.py",
    "evalhub/benchmarks/math/pt_exams_math/__init__.py",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "N", "C", "W"]
ignore = ["C901", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["evalhub"]
